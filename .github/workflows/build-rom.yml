name: Build LineageOS 17.1 (Cloud)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32z1-dev libncurses5 libncurses5-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "builder@cloud.com"
          git config --global user.name "Cloud Builder"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Sync LineageOS 17.1 Source
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          repo init --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-17.1 \
            --repo-url=https://github.com/GerritCodeReview/git-repo \
            --repo-branch=stable \
            --no-repo-verify
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch || \
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          rm -rf .repo

      - name: Clone Custom Trees
        run: |
          cd ~/lineage
          git clone https://github.com/FAISAL-AHAMED-1/android_device_samsung_a2corelte.git device/samsung/a2corelte
          git clone https://github.com/FAISAL-AHAMED-1/vendor_samsung_a2corelte.git vendor/samsung/a2corelte
          git clone https://github.com/FAISAL-AHAMED-1/android_kernel_samsung_a2corelte.git kernel/samsung/a2corelte
          git clone https://github.com/samsungexynos7870/android_device_samsung_universal7870-common.git device/samsung/universal7870-common

      - name: Compile ROM
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_a2corelte-userdebug
          mka bacon -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-a2corelte
          path: out/target/product/a2corelte/*.zip

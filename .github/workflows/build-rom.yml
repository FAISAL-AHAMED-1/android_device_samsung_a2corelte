name: Build LineageOS 17.1 (Cloud)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32z1-dev libncurses5 libncurses5-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.email "builder@cloud.com"
          git config --global user.name "Cloud Builder"
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/ccache" >> $GITHUB_ENV
          ccache -M 5G

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-lineage-${{ github.run_id }}
          restore-keys: |
            ccache-lineage-

      - name: Sync LineageOS 17.1 Source
        run: |
          mkdir -p ~/lineage
          cd ~/lineage
          repo init --depth=1 -u https://github.com/LineageOS/android.git -b lineage-17.1 --repo-url=https://github.com/GerritCodeReview/git-repo --repo-branch=stable --no-repo-verify
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags
          rm -rf .repo
          df -h /

      - name: Clone Custom Trees
        run: |
          cd ~/lineage
          git clone https://github.com/FAISAL-AHAMED-1/android_device_samsung_a2corelte.git device/samsung/a2corelte
          git clone https://github.com/FAISAL-AHAMED-1/vendor_samsung_a2corelte.git vendor/samsung/a2corelte
          git clone https://github.com/FAISAL-AHAMED-1/android_kernel_samsung_a2corelte.git kernel/samsung/a2corelte
          git clone https://github.com/samsungexynos7870/android_device_samsung_universal7870-common.git device/samsung/universal7870-common
          git clone https://github.com/samsungexynos7870/android_vendor_samsung_universal7870-common.git vendor/samsung/universal7870-common
          rm -rf hardware/samsung
          git clone --depth 1 -b lineage-17.1 https://github.com/LineageOS/android_hardware_samsung.git hardware/samsung
          test -f hardware/samsung/mkbootimg.mk

      - name: Build kernel FIRST (live-streamed log)
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_a2corelte-userdebug
          set -o pipefail
          mka out/target/product/a2corelte/kernel 2>&1 | tee kernel.log

      - name: Upload kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-log
          path: ~/lineage/kernel.log

      - name: Compile ROM (saves build.log)
        run: |
          cd ~/lineage
          source build/envsetup.sh
          lunch lineage_a2corelte-userdebug
          set -o pipefail
          mka bacon -j$(nproc) WITH_DEXPREOPT=false 2>&1 | tee build.log

      - name: Save ccache (even if build dies)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-lineage-${{ github.run_id }}

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/lineage/build.log

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-a2corelte
          path: ~/lineage/out/target/product/a2corelte/*.zip
